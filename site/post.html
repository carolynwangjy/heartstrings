<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Heartstrings — Second Meeting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #faf8f5;
      --color-text: #2d2a26;
      --color-accent: #c45c4a;
      --color-accent-dark: #9e4235;
      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body: 'Outfit', system-ui, sans-serif;
    }

    body { 
      margin: 0; 
      background: var(--color-bg); 
      font-family: var(--font-body); 
      color: var(--color-text);
    }

    .hero {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      overflow: hidden;
      text-align: center;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
      outline: 2px dashed rgba(196, 92, 74, 0.6);
      padding: 12rem;
    }

    .hero-logo {
      width: 160px;
      height: auto;
      object-fit: contain;
      margin: 0 auto 0.5rem; 
      display: block;
    }

    .hero-tagline {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-accent);
      margin-top: 0;
      margin-bottom: 2.5rem;
    }

    .hero-title {
      font-family: var(--font-display);
      font-size: clamp(2.8rem, 7vw, 4.8rem);
      font-weight: 600;
      line-height: 1.15;
      margin-top: 0;
      margin-bottom: 2.5rem;
    }
    
    .hero-title em {
      display: block;
      font-style: italic;
      color: var(--color-accent);
      font-weight: 400;
      font-size: 1.1em;
      margin: -0.15em 0; 
      position: relative;
      z-index: 3;
    }

    .hero-title span {
      display: block;
      position: relative;
      z-index: 2;
    }

    .hero-desc {
      line-height: 1.4;
      margin-top: 1rem;
    }

    .hero-desc strong {
      color: var(--color-accent);
      display: block;
      font-size: 1.9rem;
      margin-bottom: 1.2rem;
      font-weight: 600;
    }

    .hero-invitation {
      font-size: 1.9rem;
      font-weight: 400;
      color: var(--color-text);
      letter-spacing: -0.01em;
    }

    .hero-visual {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .wave {
      position: absolute;
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .wave-1 {
      width: 110vmin;
      height: 110vmin;
      background: radial-gradient(circle, rgba(196, 92, 74, 0.35) 0%, transparent 70%);
      animation: pulse 8s ease-in-out infinite;
    }

    .wave-2 {
      width: 85vmin;
      height: 85vmin;
      background: radial-gradient(circle, rgba(196, 92, 74, 0.45) 0%, transparent 65%);
      animation: pulse 6s ease-in-out infinite 1s;
    }

    .wave-3 {
      width: 55vmin;
      height: 55vmin;
      background: radial-gradient(circle, rgba(158, 66, 53, 0.55) 0%, transparent 60%);
      animation: pulse 5s ease-in-out infinite 2s;
    }

    @keyframes pulse {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.7; }
      50% { transform: translate(-50%, -50%) scale(1.05); opacity: 0.4; }
    }
  </style>
</head>
<body>

  <main>
    <section class="hero">
      <div class="hero-content">
        <img src="assets/heartstrings-logo.png" alt="Heartstrings Logo" class="hero-logo">
        
        <p class="hero-tagline">Heartstrings at Berkeley</p>
        
        <h1 class="hero-title">
          Second General Meeting
          <em>&amp;</em>
          <span>Jam Session</span>
        </h1>

        <div class="hero-desc">
          <p><strong>Friday, March 13th • 4–6 PM • Soda 380</strong></p>
          <p class="hero-invitation">
            All music lovers welcome! <br>
            Bring your instrument and let's start forming ensembles!
          </p>
        </div>
      </div>

      <div class="hero-visual" aria-hidden="true">
        <div class="wave wave-1"></div>
        <div class="wave wave-2"></div>
        <div class="wave wave-3"></div>
      </div>
    </section>
  </main>

</body>
</html>
